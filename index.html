const TT=({active,payload,label})=>{
  if(!active||!payload?.length)return null;
  return(<div style={{background:"#111",border:`1px solid ${T.bdr2}`,borderRadius:6,padding:"8px 12px",boxShadow:"0 8px 32px rgba(0,0,0,.6)",backdropFilter:"blur(20px)"}}>
    <div style={{fontSize:10,fontWeight:700,color:T.g1,marginBottom:4,fontFamily:"'Space Mono',monospace"}}>{label}</div>
    {payload.map((p,i)=><div key={i} style={{fontSize:10,color:p.color||T.sub,display:"flex",justifyContent:"space-between",gap:14}}><span>{p.name}</span><span style={{fontWeight:700,fontFamily:"'Space Mono',monospace"}}>{typeof p.value==="number"?p.value.toLocaleString("en",{maximumFractionDigits:1}):p.value}</span></div>)}
  </div>);
};

const Sec=({children,sub,tag})=><div style={{marginBottom:4}}>
  <div style={{display:"flex",alignItems:"center",gap:8}}>
    <div style={{fontSize:14,fontWeight:700,color:T.w,letterSpacing:.3}}>{children}</div>
    {tag&&<span style={{fontSize:8,fontWeight:700,color:T.g1,background:T.gDim,padding:"2px 8px",borderRadius:10,fontFamily:"'Space Mono',monospace"}}>{tag}</span>}
  </div>
  {sub&&<div style={{fontSize:10,color:T.lt}}>{sub}</div>}
</div>;

const Grid=({cols="repeat(auto-fit,minmax(180px,1fr))",gap=10,children,style})=><div style={{display:"grid",gridTemplateColumns:cols,gap,...style}}>{children}</div>;

const StatusDot=({status})=>{
  const c=status==="Compliant"||status==="Submitted"?T.grn:status==="On Track"||status==="In Progress"?T.amb:T.red;
  return <span style={{display:"inline-flex",alignItems:"center",gap:4}}><span style={{width:6,height:6,borderRadius:"50%",background:c,boxShadow:`0 0 6px ${c}`}}/><span style={{fontSize:9,color:c,fontWeight:600}}>{status}</span></span>;
};

const ProgressBar=({pct,color=T.g1})=><div style={{width:"100%",height:4,background:T.bg3,borderRadius:2,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:`linear-gradient(90deg,${color},${color}88)`,borderRadius:2,transition:"width .6s ease"}}/></div>;

/* ═══ DASHBOARD ═══ */
function Dashboard(){
  const[tab,setTab]=useState("exec");
  const[facility,setFacility]=useState("ALL");
  const[sortCol,setSortCol]=useState(null);
  const[sortDir,setSortDir]=useState("asc");
  const[tick,setTick]=useState(0);

  useEffect(()=>{const iv=setInterval(()=>setTick(t=>t+1),3000);return()=>clearInterval(iv);},[]);

  const agg=useMemo(()=>{
    const kk=facility==="ALL"?ks:[facility];
    const a={s1_24:0,s1_25:0,s2_24:0,s2_25:0,s3_24:0,s3_25:0,e24:0,e25:0,w24:0,w25:0,wGen:0,wDiv:0,sqm:0,emp:0,credits:0,ctax:0,grev:0};
    kk.forEach(k=>{const h=FACILITIES[k];
      a.s1_24+=S(h.s1.a);a.s1_25+=S(h.s1.b);
      a.s2_24+=S(h.s2.a);a.s2_25+=S(h.s2.b);
      a.s3_24+=S(h.s3.a);a.s3_25+=S(h.s3.b);
      a.e24+=S(h.elec.a);a.e25+=S(h.elec.b);
      a.w24+=S(h.water.a);a.w25+=S(h.water.b);
      a.wGen+=S(h.waste.gen);a.wDiv+=S(h.waste.div);
      a.sqm+=h.sqm;a.emp+=h.emp;a.credits+=h.carbon.credits;
      a.ctax+=h.fin.ctax;a.grev+=h.fin.grev;
    });
    a.total24=a.s1_24+a.s2_24+a.s3_24;
    a.total25=a.s1_25+a.s2_25+a.s3_25;
    return a;
  },[facility]);

  const md=useMemo(()=>{
    const kk=facility==="ALL"?ks:[facility];
    return MO.map((m,i)=>{
      const r={month:m,s1_24:0,s1_25:0,s2_24:0,s2_25:0,s3_24:0,s3_25:0,e24:0,e25:0,w24:0,w25:0};
      kk.forEach(k=>{const h=FACILITIES[k];
        r.s1_24+=h.s1.a[i];r.s1_25+=h.s1.b[i];
        r.s2_24+=h.s2.a[i];r.s2_25+=h.s2.b[i];
        r.s3_24+=h.s3.a[i];r.s3_25+=h.s3.b[i];
        r.e24+=h.elec.a[i];r.e25+=h.elec.b[i];
        r.w24+=h.water.a[i];r.w25+=h.water.b[i];
      });
      r.total24=r.s1_24+r.s2_24+r.s3_24;
      r.total25=r.s1_25+r.s2_25+r.s3_25;
      return r;
    });
  },[facility]);

  const hc=useMemo(()=>{
    return ks.map(k=>{
      const h=FACILITIES[k];
      const t24=S(h.s1.a)+S(h.s2.a)+S(h.s3.a);
      const t25=S(h.s1.b)+S(h.s2.b)+S(h.s3.b);
      return{id:k,nm:h.f,city:h.city,sector:h.sector,sqm:h.sqm,emp:h.emp,
        tY:P(t25,t24),t25,eY:P(S(h.elec.b),S(h.elec.a)),wY:P(S(h.water.b),S(h.water.a)),
        divR:S(h.waste.div)/S(h.waste.gen)*100,
        esgAvg:(h.esg.e+h.esg.s+h.esg.g)/3,risk:h.ai.risk,pred:h.ai.pred,
        grev:h.fin.grev,ctax:h.fin.ctax,roi:h.fin.roi,
        csrd:h.compliance.csrd,issb:h.compliance.issb,offset:h.carbon.offset};
    });
  },[]);

  const d=agg;
  const tY=P(d.total25,d.total24);
  const dR=d.wGen>0?d.wDiv/d.wGen*100:0;
  const handleSort=(c)=>{if(sortCol===c)setSortDir(sortDir==="asc"?"desc":"asc");else{setSortCol(c);setSortDir("asc");}};

  const sortedHc=useMemo(()=>{
    const arr=[...hc];
    if(sortCol)arr.sort((a,b)=>sortDir==="asc"?(a[sortCol]??0)-(b[sortCol]??0):(b[sortCol]??0)-(a[sortCol]??0));
    return arr;
  },[hc,sortCol,sortDir]);

  /* ═══ EXECUTIVE ═══ */
  const renderExec=()=>{
    const insights=[
      {i:"🧠",t:`Net emissions down ${Math.abs(tY||0).toFixed(1)}% — scenario analysis suggests a further 3.2% reduction achievable by Q4 through HVAC optimization`,g:true},
      {i:"⚡",t:`Frankfurt leads with −12.1% predicted trajectory. Deploy similar heat-pump retrofits across DE-FRA playbook to 4 more sites`,g:true},
      {i:"⚠️",t:`São Paulo Scope 3 supply chain emissions showing anomaly: +2.1% upstream transport — rerouting model activated`,g:false},
      {i:"🏆",t:`Sydney achieves highest ESG composite (86.7) — carbon-neutral certification target: 6 months ahead of schedule`,g:true}
    ];
    const avgEsg=hc.reduce((s,h)=>s+h.esgAvg,0)/hc.length;
    const avgRisk=hc.reduce((s,h)=>s+h.risk,0)/hc.length;
    const netZeroYr=2040+Math.round((100-avgEsg)/10);

    return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {/* AI Insights */}
      <Card style={{padding:"14px 16px",background:"linear-gradient(135deg,#0A0A0A,#111 40%,#0A1A10 100%)"}} glow>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:11,fontWeight:700,color:T.g1,fontFamily:"'Space Mono',monospace",letterSpacing:1}}>◉ STRATEGIC INSIGHTS</span>
          <span style={{fontSize:8,color:T.lt,fontFamily:"'Space Mono',monospace",animation:"pulse 2s infinite"}}>LIVE • {new Date().toLocaleTimeString()}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:6}}>
          {insights.map((ins,i)=>(<div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"6px 10px",borderRadius:6,background:"rgba(0,255,136,.03)",border:"1px solid rgba(0,255,136,.06)",animation:`slideUp .4s ease ${i*0.1}s both`}}><span style={{fontSize:14,flexShrink:0}}>{ins.i}</span><span style={{fontSize:10,color:ins.g?"rgba(0,255,136,.85)":"rgba(255,184,0,.85)",lineHeight:1.4}}>{ins.t}</span></div>))}
        </div>
      </Card>

      {/* KPI Row */}
      <Grid cols="repeat(auto-fit,minmax(160px,1fr))" gap={10}>
        <Metric label="TOTAL EMISSIONS" value={F(d.total25)+" t"} sub={`PY: ${F(d.total24)} tCO₂e`} yoy={tY} icon="🌍" accent={T.g1} badge="SCOPE 1+2+3"/>
        <Metric label="SCOPE 1 — DIRECT" value={F(d.s1_25)+" t"} sub={`PY: ${F(d.s1_24)}`} yoy={P(d.s1_25,d.s1_24)} icon="🏭" accent={T.amb}/>
        <Metric label="SCOPE 2 — ENERGY" value={F(d.s2_25)+" t"} sub={`PY: ${F(d.s2_24)}`} yoy={P(d.s2_25,d.s2_24)} icon="⚡" accent={T.cyan}/>
        <Metric label="SCOPE 3 — VALUE CHAIN" value={F(d.s3_25)+" t"} sub={`PY: ${F(d.s3_24)}`} yoy={P(d.s3_25,d.s3_24)} icon="🔗" accent={T.purple}/>
        <Metric label="CARBON CREDITS" value={F(d.credits)} sub="Active offset portfolio" icon="💎" accent={T.g3} inv badge="PORTFOLIO"/>
        <Metric label="DIVERSION RATE" value={dR.toFixed(1)+"%"} sub={`${F(d.wDiv)}t diverted / ${F(d.wGen)}t total`} icon="♻️" accent={T.g2} inv/>
        <Metric label="GREEN REVENUE" value={FM(d.grev)} sub={`Carbon Tax Exposure: ${FM(d.ctax)}`} icon="💰" accent={T.grn} inv/>
        <Metric label="NET-ZERO TARGET" value={netZeroYr} sub={`ESG Avg: ${avgEsg.toFixed(1)} | Risk: ${avgRisk.toFixed(0)}`} icon="🎯" accent={T.blue} badge="SBTi"/>
      </Grid>

      {/* Facility Scorecard + Globe placeholder */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Card style={{padding:16}}>
          <Sec sub="8 Global Facilities — Click to drill down" tag="REAL-TIME">Facility Command Board</Sec>
          <div style={{display:"flex",flexDirection:"column",gap:5,marginTop:8}}>
            {ks.map((k,idx)=>{const h=FACILITIES[k];const t25=S(h.s1.b)+S(h.s2.b)+S(h.s3.b);const t24=S(h.s1.a)+S(h.s2.a)+S(h.s3.a);const yy=P(t25,t24);
            return(
              <div key={k} onClick={()=>setFacility(k)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:8,background:facility===k?T.gDim:T.bg3,cursor:"pointer",border:facility===k?`1px solid ${T.gDim3}`:"1px solid transparent",transition:"all .2s",animation:`slideUp .3s ease ${idx*0.05}s both`}}>
                <div style={{width:34,height:34,borderRadius:8,background:`linear-gradient(135deg,${T.g4},${T.g5})`,display:"flex",alignItems:"center",justifyContent:"center",color:T.w,fontSize:9,fontWeight:700,fontFamily:"'Space Mono',monospace",flexShrink:0}}>{h.country}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:11,fontWeight:600,color:T.dk}}>{k} <span style={{fontSize:9,color:T.lt,fontWeight:400}}>— {h.city}</span></div>
                  <div style={{fontSize:8,color:T.sub,display:"flex",gap:6,flexWrap:"wrap",fontFamily:"'Space Mono',monospace"}}>
                    <span>{h.sector}</span><span>•</span><span>{h.sqm.toLocaleString()}m²</span><span>•</span><span>{h.emp} staff</span>
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:12,fontWeight:800,color:yy<0?T.grn:T.red,fontFamily:"'Space Mono',monospace"}}>{FP(yy)}</div>
                  <div style={{fontSize:8,color:T.lt}}>ESG {h.esg.e}/{h.esg.s}/{h.esg.g}</div>
                </div>
              </div>);
            })}
          </div>
        </Card>

        {/* Network Visualization Placeholder */}
        <Card style={{padding:16,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",background:"radial-gradient(circle at 50% 50%,#0A1A10 0%,#050505 70%)"}}>
          <div style={{position:"relative",width:200,height:200}}>
            <div style={{position:"absolute",inset:0,border:"1px solid rgba(0,255,136,.1)",borderRadius:"50%"}}/>
            <div style={{position:"absolute",inset:20,border:"1px solid rgba(0,255,136,.08)",borderRadius:"50%"}}/>
            <div style={{position:"absolute",inset:40,border:"1px solid rgba(0,255,136,.06)",borderRadius:"50%"}}/>
            {[{x:50,y:8,l:"SG"},{x:15,y:35,l:"DE"},{x:85,y:25,l:"US"},{x:55,y:50,l:"AE"},{x:80,y:55,l:"JP"},{x:20,y:65,l:"GB"},{x:35,y:80,l:"BR"},{x:70,y:78,l:"AU"}].map((p,i)=>(
              <div key={i} style={{position:"absolute",left:`${p.x}%`,top:`${p.y}%`,transform:"translate(-50%,-50%)",animation:`float 3s ease ${i*0.4}s infinite`}}>
                <div style={{width:24,height:24,borderRadius:"50%",background:T.gDim2,border:`1px solid ${T.g3}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7,fontWeight:700,color:T.g1,fontFamily:"'Space Mono',monospace",boxShadow:`0 0 12px rgba(0,255,136,.15)`}}>{p.l}</div>
              </div>
            ))}
          </div>
          <div style={{fontSize:14,fontWeight:700,color:T.g1,textAlign:"center",marginTop:12,fontFamily:"'Space Mono',monospace"}}>GLOBAL NETWORK</div>
          <div style={{fontSize:10,color:T.sub,textAlign:"center",maxWidth:220,marginTop:4}}>8 facilities across 8 countries. Real-time emissions monitoring via IoT + satellite telemetry.</div>
          <div style={{marginTop:12,display:"flex",gap:8}}>
            {[{l:"Total Sites",v:"8"},{l:"Countries",v:"8"},{l:"Employees",v:F(ks.reduce((s,k)=>s+FACILITIES[k].emp,0))},{l:"Area",v:F(ks.reduce((s,k)=>s+FACILITIES[k].sqm,0))+"m²"}].map((s,i)=>(
              <div key={i} style={{textAlign:"center",padding:"4px 8px",borderRadius:6,background:T.gDim}}>
                <div style={{fontSize:12,fontWeight:800,color:T.g1,fontFamily:"'Space Mono',monospace"}}>{s.v}</div>
                <div style={{fontSize:7,color:T.sub,textTransform:"uppercase",letterSpacing:.5}}>{s.l}</div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {/* Performance Matrix */}
      <Card style={{padding:16}}>
        <Sec sub="YTD Performance — Emissions, ESG, Risk, Financial — Click headers to sort" tag="MATRIX">Global Facility Performance</Sec>
        <div style={{overflowX:"auto",marginTop:8}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
            <thead><tr style={{borderBottom:`2px solid ${T.g4}`}}>
              {["Facility","City","Sector","Emissions YoY","Energy YoY","Water YoY","Diversion %","ESG Score","Risk Score","Predicted Δ","Green Rev","Carbon Tax"].map((h,i)=>{
                const sortKeys=["id","city","sector","tY","eY","wY","divR","esgAvg","risk","pred","grev","ctax"];
                const sk=sortKeys[i];
                return <th key={h} onClick={()=>handleSort(sk)} style={{padding:"8px 6px",textAlign:i<3?"left":"right",fontWeight:700,color:sortCol===sk?T.g1:T.sub,whiteSpace:"nowrap",fontSize:9,cursor:"pointer",userSelect:"none",fontFamily:"'Space Mono',monospace",letterSpacing:.5,textTransform:"uppercase"}}>{h}{sortCol===sk?(sortDir==="asc"?" ↑":" ↓"):""}</th>;
              })}
            </tr></thead>
            <tbody>{sortedHc.map((h,i)=>(
              <tr key={h.id} style={{borderBottom:`1px solid ${T.bdr}`,background:i%2?T.card:T.bg2,cursor:"pointer"}} onClick={()=>setFacility(h.id)}>
                <td style={{padding:"8px 6px",fontWeight:700,color:T.g1,fontSize:11,fontFamily:"'Space Mono',monospace"}}>{h.id}</td>
                <td style={{padding:"8px 6px",color:T.dk,fontSize:10}}>{h.city}</td>
                <td style={{padding:"8px 6px",color:T.sub,fontSize:9}}>{h.sector}</td>
                <td style={{padding:"8px 6px",textAlign:"right"}}><span style={{fontWeight:700,color:(h.tY||0)<0?T.grn:T.red,fontFamily:"'Space Mono',monospace"}}>{FP(h.tY)}</span></td>
                <td style={{padding:"8px 6px",textAlign:"right"}}><span style={{fontWeight:600,color:(h.eY||0)<0?T.grn:T.red}}>{FP(h.eY)}</span></td>
                <td style={{padding:"8px 6px",textAlign:"right"}}><span style={{fontWeight:600,color:(h.wY||0)<0?T.grn:T.red}}>{FP(h.wY)}</span></td>
                <td style={{padding:"8px 6px",textAlign:"right",fontWeight:700}}>{h.divR.toFixed(1)}%</td>
                <td style={{padding:"8px 6px",textAlign:"right"}}><span style={{fontWeight:700,color:h.esgAvg>=80?T.grn:h.esgAvg>=70?T.amb:T.red}}>{h.esgAvg.toFixed(1)}</span></td>
                <td style={{padding:"8px 6px",textAlign:"right"}}><span style={{fontWeight:600,color:h.risk<=20?T.grn:h.risk<=30?T.amb:T.red}}>{h.risk}</span></td>
                <td style={{padding:"8px 6px",textAlign:"right"}}><span style={{fontWeight:700,color:T.cyan,fontFamily:"'Space Mono',monospace"}}>{FP(h.pred)}</span></td>
                <td style={{padding:"8px 6px",textAlign:"right",fontWeight:600,color:T.grn}}>${h.grev}M</td>
                <td style={{padding:"8px 6px",textAlign:"right",fontWeight:600,color:T.red}}>${h.ctax}M</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      </Card>
    </div>);
  };

  /* ═══ EMISSIONS ═══ */
  const renderEmissions=()=>{
    const s1Y=P(d.s1_25,d.s1_24),s2Y=P(d.s2_25,d.s2_24),s3Y=P(d.s3_25,d.s3_24);
    const scopeBreak=[{name:"Scope 1",v24:d.s1_24,v25:d.s1_25,color:T.amb},{name:"Scope 2",v24:d.s2_24,v25:d.s2_25,color:T.cyan},{name:"Scope 3",v24:d.s3_24,v25:d.s3_25,color:T.purple}];
    const intensity25=d.sqm>0?d.total25/d.sqm:0;
    const intensity24=d.sqm>0?d.total24/d.sqm:0;

    return(<div style={{display:"flex",flexDirection:"column",gap:12}}>
      <Grid cols="repeat(auto-fit,minmax(155px,1fr))">
        <Metric label="SCOPE 1 DIRECT" value={F(d.s1_25)+"t"} sub={`PY: ${F(d.s1_24)}`} yoy={s1Y} icon="🏭" accent={T.amb}/>
        <Metric label="SCOPE 2 INDIRECT" value={F(d.s2_25)+"t"} sub={`PY: ${F(d.s2_24)}`} yoy={s2Y} icon="⚡" accent={T.cyan}/>
        <Metric label="SCOPE 3 VALUE CHAIN" value={F(d.s3_25)+"t"} sub={`PY: ${F(d.s3_24)}`} yoy={s3Y} icon="🔗" accent={T.purple}/>
        <Metric label="TOTAL EMISSIONS" value={F(d.total25)+"t"} sub={`PY: ${F(d.total24)}`} yoy={tY} icon="🌍" accent={T.g1} badge="GHG PROTOCOL"/>
        <Metric label="CARBON INTENSITY" value={intensity25.toFixed(2)} sub={`tCO₂e/m² | PY: ${intensity24.toFixed(2)}`} yoy={P(intensity25,intensity24)} icon="📐" accent={T.blue}/>
      </Grid>

      <Grid cols="1fr 1fr">
        <Card style={{padding:14}}>
          <Sec sub="Scope 1 + 2 + 3 stacked monthly comparison">Total Emissions — 2024 vs 2025</Sec>
          <ResponsiveContainer width="100%" height={220}><ComposedChart data={md}><CartesianGrid strokeDasharray="3 3" stroke="#1A1A1A"/><XAxis dataKey="month" tick={{fontSize:9,fill:T.sub}} stroke={T.bdr}/><YAxis tick={{fontSize:9,fill:T.sub}} stroke={T.bdr} tickFormatter={F}/><Tooltip content={<TT/>}/><Legend wrapperStyle={{fontSize:9}}/>
            <Bar dataKey="total24" name="2024 Total" fill="rgba(255,255,255,.08)" radius={[2,2,0,0]} barSize={12}/>
            <Bar dataKey="total25" name="2025 Total" fill={T.g3} radius={[2,2,0,0]} barSize={12}/>
            <Line dataKey="s1_25" name="Scope 1" stroke={T.amb} strokeWidth={1.5} dot={false}/>
            <Line dataKey="s2_25" name="Scope 2" stroke={T.cyan} strokeWidth={1.5} dot={false}/>
          </ComposedChart></ResponsiveContainer>
        </Card>
        <Card style={{padding:14}}>
          <Sec sub="11-Category GHG Protocol Breakdown">Emissions by Source Category</Sec>
          <ResponsiveContainer width="100%" height={220}><PieChart><Pie data={SCOPE_CATS} cx="50%" cy="50%" innerRadius={45} outerRadius={82} paddingAngle={2} dataKey="value" nameKey="name" label={({name,percent})=>`${name.split(' ')[0]} ${(percent*100).toFixed(0)}%`} style={{fontSize:7.5,fill:T.sub}}>
            {SCOPE_CATS.map((e,i)=><Cell key={i} fill={e.color}/>)}</Pie><Tooltip/></PieChart></ResponsiveContainer>
        </Card>
      </Grid>

      <Grid cols="1fr 1fr">
        <Card style={{padding:14}}>
          <Sec>Scope 3 Breakdown — Monthly</Sec>
          <ResponsiveContainer width="100%" height={200}><AreaChart data={md}><CartesianGrid strokeDasharray="3 3" stroke="#1A1A1A"/><XAxis dataKey="month" tick={{fontSize:9,fill:T.sub}} stroke={T.bdr}/><YAxis tick={{fontSize:9,fill:T.sub}} stroke={T.bdr} tickFormatter={F}/><Tooltip content={<TT/>}/><Legend wrapperStyle={{fontSize:9}}/>
            <Area dataKey="s3_24" name="2024" fill="rgba(170,102,255,.08)" stroke="rgba(170,102,255,.4)" strokeWidth={1.5}/>
            <Area dataKey="s3_25" name="2025" fill="rgba(170,102,255,.15)" stroke={T.purple} strokeWidth={2}/>
          </AreaChart></ResponsiveContainer>
        </Card>
        <Card style={{padding:14}}>
          <Sec>Scope 1 vs Scope 2 Trend</Sec>

          <ResponsiveContainer width="100%" height={220}><LineChart data={predData}><CartesianGrid strokeDasharray="3 3" stroke="#1A1A1A"/><XAxis dataKey="month" tick={{fontSize:9,fill:T.sub}} stroke={T.bdr}/><YAxis tick={{fontSize:9,fill:T.sub}} stroke={T.bdr} tickFormatter={F}/><Tooltip content={<TT/>}/><Legend wrapperStyle={{fontSize:9}}/>
            <Line dataKey="actual" name="Actual 2025" stroke={T.g1} strokeWidth={2.5} dot={{r:3,fill:T.g1}}/>
            <Line dataKey="predicted" name="Projected" stroke={T.cyan} strokeWidth={2} strokeDasharray="6 3" dot={{r:2}}/>
            <Line dataKey="optimized" name="Optimized" stroke={T.purple} strokeWidth={1.5} strokeDasharray="3 3" dot={false}/>
            <Line dataKey="baseline" name="Baseline" stroke="rgba(255,255,255,.15)" strokeWidth={1} dot={false}/>
          </LineChart></ResponsiveContainer>
        </Card>
        <Card style={{padding:14}}>
          <Sec sub="Ranked by potential impact">Recommended Actions</Sec>
          <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:8}}>
            {[
              {action:"Deploy smart HVAC scheduling across SG-SIN & AE-DXB",impact:"-4,200 tCO₂e/yr",conf:96,priority:"Critical"},
              {action:"Switch US-NYC to 100% renewable PPA by Q3 2026",impact:"-8,100 tCO₂e/yr",conf:92,priority:"High"},
              {action:"Optimize JP-TKY waste-to-energy conversion pipeline",impact:"-1,800 tCO₂e/yr",conf:88,priority:"Medium"},
              {action:"Reroute BR-SAO upstream logistics to rail transport",impact:"-2,400 tCO₂e/yr",conf:84,priority:"Medium"},
              {action:"Install DAC units at AU-SYD for residual offset",impact:"-1,200 tCO₂e/yr",conf:78,priority:"Low"}
            ].map((r,i)=>(
              <div key={i} style={{padding:"8px 12px",borderRadius:6,background:T.bg3,border:`1px solid ${i===0?'rgba(0,255,136,.2)':T.bdr}`,animation:`slideUp .3s ease ${i*0.08}s both`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
                  <span style={{fontSize:10,fontWeight:600,color:T.dk}}>{r.action}</span>
                  <span style={{fontSize:8,fontWeight:700,color:r.priority==="Critical"?T.red:r.priority==="High"?T.amb:T.sub,background:r.priority==="Critical"?T.redDim:r.priority==="High"?T.ambDim:"rgba(255,255,255,.05)",padding:"1px 6px",borderRadius:8}}>{r.priority}</span>
                </div>
                <div style={{display:"flex",gap:12,fontSize:9,color:T.lt,fontFamily:"'Space Mono',monospace"}}>
                  <span>Impact: <span style={{color:T.grn,fontWeight:700}}>{r.impact}</span></span>
                  <span>Confidence: <span style={{color:T.cyan}}>{r.conf}%</span></span>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </Grid>

      <Card style={{padding:14}}>
        <Sec sub="Anomaly detection with root cause analysis powered by transformer architecture" tag="ANOMALY ENGINE">Real-Time Monitoring Feed</Sec>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:8,marginTop:8}}>
          {[
            {time:"2h ago",facility:"BR-SAO",type:"Scope 3 Spike",desc:"Upstream transport emissions +14% vs rolling average. Root cause: supplier rerouting via road freight. Auto-alert sent to procurement.",severity:"High"},
            {time:"6h ago",facility:"AE-DXB",type:"Energy Anomaly",desc:"Chiller plant COP dropped below 4.0. Predicted maintenance window: 72h. Work order auto-generated.",severity:"Medium"},
            {time:"1d ago",facility:"SG-SIN",type:"Water Efficiency",desc:"Water recycling rate improved to 34% after grey-water system commissioning. Target exceeded by 6%.",severity:"Info"}
          ].map((a,i)=>(
            <div key={i} style={{padding:"10px 14px",borderRadius:8,background:T.bg3,borderLeft:`3px solid ${a.severity==="High"?T.red:a.severity==="Medium"?T.amb:T.g2}`}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:10,fontWeight:700,color:T.dk}}>{a.facility} — {a.type}</span>
                <span style={{fontSize:8,color:T.lt,fontFamily:"'Space Mono',monospace"}}>{a.time}</span>
              </div>
              <div style={{fontSize:9,color:T.sub,lineHeight:1.5}}>{a.desc}</div>
            </div>
          ))}
        </div>
      </Card>
    </div>);
  };

  /* ═══ MAIN ═══ */
  return(<div style={{minHeight:"100vh",background:T.bg,fontFamily:"'Sora',sans-serif"}}>
    <div style={{background:"rgba(255,184,0,.1)",borderBottom:"1px solid rgba(255,184,0,.3)",color:"#FFB800",fontSize:10,padding:"6px 20px",textAlign:"center",fontFamily:"'Space Mono',monospace",letterSpacing:.5}}>CONCEPT BLUEPRINT · ALL FACILITIES AND FIGURES ARE ILLUSTRATIVE · DESIGNED BY ARAFAT LAKHANI</div>
    {/* Header */}
    <div style={{background:"linear-gradient(90deg,#050505,#0A1210,#050505)",padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,borderBottom:`1px solid ${T.bdr}`}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:32,height:32,borderRadius:6,background:`linear-gradient(135deg,${T.g4},${T.g1})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,animation:"glow 3s ease infinite"}}>🌍</div>
        <div>
          <div style={{fontSize:15,fontWeight:800,color:T.w,letterSpacing:2,fontFamily:"'Space Mono',monospace"}}>TERRA <span style={{color:T.g1}}>NEXUS</span></div>
          <div style={{fontSize:8,color:T.lt,letterSpacing:1.5,textTransform:"uppercase"}}>Global ESG & Carbon Intelligence Platform</div>
        </div>
        <div style={{height:20,width:1,background:T.bdr2,margin:"0 4px"}}/>
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          <span style={{width:6,height:6,borderRadius:"50%",background:T.g1,boxShadow:`0 0 8px ${T.g1}`,animation:"pulse 2s infinite"}}/>
          <span style={{fontSize:8,color:T.g2,fontFamily:"'Space Mono',monospace"}}>SYSTEMS ONLINE</span>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        <select value={facility} onChange={e=>setFacility(e.target.value)} style={{padding:"5px 10px",borderRadius:6,border:`1px solid ${T.bdr2}`,background:T.bg3,color:T.w,fontSize:10,fontWeight:600,cursor:"pointer",outline:"none",fontFamily:"'Space Mono',monospace"}}>
          <option value="ALL">◉ All Facilities (8)</option>
          {ks.map(k=><option key={k} value={k}>{k} — {FACILITIES[k].city}</option>)}
        </select>
        <div style={{background:T.gDim,borderRadius:4,padding:"4px 8px",fontSize:9,color:T.g1,fontWeight:700,fontFamily:"'Space Mono',monospace",border:`1px solid ${T.gDim2}`}}>2025 YTD</div>
      </div>
    </div>

    {/* Tabs */}
    <div style={{background:T.bg2,borderBottom:`1px solid ${T.bdr}`,padding:"3px 20px",display:"flex",gap:2,overflowX:"auto"}}>
      {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 12px",border:"none",borderRadius:6,cursor:"pointer",fontSize:10,fontWeight:tab===t.id?700:400,color:tab===t.id?T.bg:T.sub,background:tab===t.id?T.g1:"transparent",whiteSpace:"nowrap",fontFamily:"'Space Mono',monospace",letterSpacing:.3,transition:"all .2s"}}>
        <span style={{fontSize:10}}>{t.ic}</span>{t.l}
      </button>)}
    </div>

    {/* Facility Banner */}
    {facility!=="ALL"&&(<div style={{margin:"8px 20px 0",padding:"8px 14px",background:T.bg3,borderRadius:8,border:`1px solid ${T.gDim2}`,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <div style={{width:34,height:34,borderRadius:8,background:`linear-gradient(135deg,${T.g4},${T.g1})`,display:"flex",alignItems:"center",justifyContent:"center",color:"#050505",fontWeight:800,fontSize:11,fontFamily:"'Space Mono',monospace"}}>{FACILITIES[facility].country}</div>
      <div style={{flex:1,minWidth:100}}>
        <div style={{fontSize:12,fontWeight:700,color:T.w}}>{FACILITIES[facility].f}</div>
        <div style={{fontSize:9,color:T.sub,display:"flex",gap:6,flexWrap:"wrap",fontFamily:"'Space Mono',monospace"}}>
          <span>{FACILITIES[facility].city}, {FACILITIES[facility].country}</span><span>•</span>
          <span>{FACILITIES[facility].sector}</span><span>•</span>
          <span>{FACILITIES[facility].sqm.toLocaleString()}m²</span><span>•</span>
          <span>{FACILITIES[facility].emp} employees</span>
        </div>
      </div>
      <button onClick={()=>setFacility("ALL")} style={{padding:"4px 10px",borderRadius:4,border:`1px solid ${T.bdr2}`,background:T.bg2,cursor:"pointer",fontSize:9,fontFamily:"'Space Mono',monospace",color:T.sub}}>✕ CLEAR</button>
    </div>)}

    {/* Content */}
    <div style={{padding:"12px 20px",maxWidth:1440,margin:"0 auto"}}>
      {tab==="exec"&&renderExec()}
      {tab==="emissions"&&renderEmissions()}
      {tab==="scope3"&&renderScope3()}
      {tab==="carbon"&&renderCarbon()}
      {tab==="esg"&&renderESG()}
      {tab==="fin"&&renderFin()}
      {tab==="compliance"&&renderCompliance()}
      {tab==="ai"&&renderAI()}
    </div>

    {/* Footer */}
    <div style={{padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"center",gap:8,borderTop:`1px solid ${T.bdr}`,background:T.bg2,marginTop:12}}>
      <span style={{width:4,height:4,borderRadius:"50%",background:T.g3}}/>
      <span style={{fontSize:8,color:T.lt,fontFamily:"'Space Mono',monospace",letterSpacing:1}}>TERRA NEXUS — ESG & carbon analytics blueprint designed by Arafat Lakhani • Illustrative data for 8 fictional facilities • GHG Protocol methodology</span>
      <span style={{width:4,height:4,borderRadius:"50%",background:T.g3}}/>
    </div>
  </div>);
}

document.getElementById('loading').style.display='none';
ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard/>);
</script></body></html>
